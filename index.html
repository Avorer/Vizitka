<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="description" content="AvorerInc: портфолио, контакты и заказ веб-вёрстки">
  <title>AvorerInc — терминал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v11">
</head>
<body>
  <div class="window" id="window">
    <main class="screen" id="screen">
      <h1 class="sr">AvorerInc: портфолио и заказ веб-вёрстки</h1>
      <div id="out" role="log" aria-live="polite"></div>
      <noscript>
        <p>Для терминала нужен JavaScript. Проекты:</p>
        <p><a href="https://команда-расход.рф">Сайт команды РАСХОД</a><br><a href="https://avorer.github.io/RASHOD-join/">Набор в РАСХОД</a><br><a href="https://github.com/Avorer">GitHub</a></p>
      </noscript>
      <form class="line" id="form" autocomplete="off">
        <label for="cmd" id="prompt">гость@avorer:~$</label><span class="typed" aria-hidden="true"><span id="before"></span><span class="cursor" id="at"> </span><span id="after"></span></span>
        <input id="cmd" type="text" enterkeyhint="send" autocapitalize="none" autocorrect="off" spellcheck="false">
      </form>
    </main>
  </div>

  <!-- «программа» snake: запускается командой snake -->
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Игра «Змейка»" tabindex="-1" hidden>
    <div class="game">
      <p class="hud"><span>./snake</span><span>счёт: <b id="score">0</b></span><span>рекорд: <b id="best">0</b></span></p>
      <div class="field">
        <canvas id="game" width="400" height="400" aria-label="Игровое поле"></canvas>
        <div id="overlay" class="overlay"><p id="overlay-text">НАЖМИ ПРОБЕЛ</p></div>
      </div>
      <p class="help help-pc">стрелки / WASD — ход · пробел — старт и пауза<br><span class="exit">выход из игры: <b class="hl">q</b> или <b class="hl">Esc</b></span></p>
      <p class="help help-touch">тап по полю — старт и пауза<br>свайп по полю — поворот<br><span class="exit">тап мимо поля — выход</span></p>
    </div>
  </section>

  <script src="js/config.js?v3"></script>
  <script src="js/script.js?v6"></script>
  <script src="js/music.js?v3"></script>
  <script src="js/keys.js?v3"></script>
  <script src="js/terminal.js?v7"></script>
</body>
</html>
