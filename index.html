<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="description" content="AvorerInc: портфолио, контакты и заказ веб-вёрстки">
  <title>AvorerInc — терминал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v5">
</head>
<body>
  <div class="window" id="window">
    <header class="bar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>гость@avorer: ~</h1>
      <button id="music" class="music" type="button" aria-pressed="false" aria-label="Музыка">♫ <span>ВЫКЛ</span></button>
    </header>

    <main class="screen" id="screen">
      <div id="out" role="log" aria-live="polite"></div>
      <noscript>
        <p>Для терминала нужен JavaScript. Проекты:</p>
        <p><a href="https://команда-расход.рф">Сайт команды РАСХОД</a><br><a href="https://avorer.github.io/RASHOD-join/">Набор в РАСХОД</a><br><a href="https://github.com/Avorer">GitHub</a></p>
      </noscript>
      <form class="line" id="form" autocomplete="off">
        <label for="cmd" id="prompt">гость@avorer:~$</label>
        <input id="cmd" type="text" enterkeyhint="send" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="напиши help">
      </form>
    </main>

    <nav class="chips" id="chips" aria-label="Быстрые команды"></nav>
  </div>

  <!-- окно игры: открывается командой snake -->
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Игра «Змейка»" hidden>
    <div class="game">
      <div class="bar">
        <h2>./snake</h2>
        <button type="button" class="close" id="close">выйти ✕</button>
      </div>
      <div class="hud">
        <span>СЧЁТ <b id="score">0</b></span>
        <span>РЕКОРД <b id="best">0</b></span>
      </div>
      <div class="field">
        <canvas id="game" width="400" height="400" aria-label="Игровое поле"></canvas>
        <div id="overlay" class="overlay"><p id="overlay-text">НАЖМИ ПРОБЕЛ</p></div>
      </div>
      <p class="help help-pc">Стрелки или WASD — управление · Пробел — старт / пауза · Esc — выход</p>
      <p class="help help-touch">Свайпай по полю или жми кнопки</p>
      <div class="pad" aria-label="Кнопки управления">
        <button data-dir="up" class="b-up" aria-label="Вверх">▲</button>
        <button data-dir="left" class="b-left" aria-label="Влево">◀</button>
        <button data-dir="down" class="b-down" aria-label="Вниз">▼</button>
        <button data-dir="right" class="b-right" aria-label="Вправо">▶</button>
      </div>
    </div>
  </section>

  <script src="js/config.js?v1"></script>
  <script src="js/script.js?v5"></script>
  <script src="js/music.js?v1"></script>
  <script src="js/terminal.js?v1"></script>
</body>
</html>
